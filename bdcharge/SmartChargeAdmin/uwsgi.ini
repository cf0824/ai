[uwsgi]
uid = root
gid = root

# ========== 防止重复启动的关键设置 ==========
master = true
thunder-lock = true
single-interpreter = true

# 使用文件锁，防止第二个实例启动
lockfile = /app/uwsgi.lock

# 关键：设置独占 socket
master-fifo = /app/uwsgi.fifo

buffer-size = 65536

pidfile=/app/uwsgi.pid

# Django-related settings

#socket = :28001
http-socket = 0.0.0.0:28001

# the base directory (full path)
chdir           = /app

pythonpath      = /app

# Django s wsgi file
module          = admin_cfg.wsgi

# process-related settings
# master
enable-threads = true
lazy-apps = true  # 每个工作进程单独加载应用

# maximum number of worker processes
processes = 4
threads = 2

# 防止工作进程太多
max-workers = 8

# 优化内存管理
max-requests = 1000
reload-on-rss = 256
reload-on-as = 768

# ... with appropriate permissions - may be needed
# chmod-socket    = 664
# clear environment on exit
vacuum          = true

#Django 代码改动时立即生效;
py-autoreload = 0

# 启用详细日志
logto = uwsgi_deamon.log
# 或者禁用守护进程模式，日志直接输出到控制台（用于调试）
# daemonize = 

# 设置 harakiri 超时（单位：秒），例如 60 秒
harakiri = 60
# 请求超时后打印堆栈跟踪
harakiri-verbose = true
socket-timeout = 30

